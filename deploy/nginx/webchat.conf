# ==============================================================================
# Cấu hình Nginx Virtual Host cho hệ thống Web Chat (NestJS + React + MySQL)
# Môn học Linux - Đề tài số 18
# ==============================================================================

# Chuyển đổi header cho kết nối thời gian thực WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Giới hạn tần suất request (Rate Limiting) chống spam DoS
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=15r/s;

# Upstream trỏ đến NestJS Application Server
upstream nestjs_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. Cấu hình HTTP (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Thư mục chứa bản build tĩnh của React Frontend (fe/dist)
    root /var/www/webchat/fe/dist;
    index index.html;

    # Nén Gzip file tĩnh
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # 1.1. Phục vụ React SPA & Xử lý lỗi 404 khi người dùng F5
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 1.2. Cache file tĩnh (JS, CSS, hình ảnh)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 1.3. Reverse Proxy cho REST API của NestJS
    location /api/ {
        limit_req zone=chat_limit burst=20 nodelay;
        proxy_pass http://nestjs_backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1.4. Reverse Proxy cho WebSocket Gateway của NestJS (/socket.io/)
    location /socket.io/ {
        proxy_pass http://nestjs_backend/socket.io/;
        proxy_http_version 1.1;

        # Header bắt tay WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    access_log /var/log/nginx/webchat_access.log;
    error_log /var/log/nginx/webchat_error.log warn;
}

# 2. Cấu hình HTTPS & WSS (Port 443 - Bảo mật SSL)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/ssl/certs/webchat-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/webchat-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/webchat/fe/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /api/ {
        limit_req zone=chat_limit burst=20 nodelay;
        proxy_pass http://nestjs_backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io/ {
        proxy_pass http://nestjs_backend/socket.io/;
        proxy_http_version 1.1;

        # WebSocket Secure Upgrade (WSS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    access_log /var/log/nginx/webchat_ssl_access.log;
    error_log /var/log/nginx/webchat_ssl_error.log warn;
}
